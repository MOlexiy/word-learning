# Angular SPA + reverse proxy на API: фронт і /api на одному origin,
# тому HttpOnly-куки з SameSite=Strict працюють без CORS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Переклади та index.html не кешуємо — інакше після оновлення лишаться старі тексти.
  location /i18n/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Бандли Angular мають хеш в імені (outputHashing: all) — кешуємо назавжди.
  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: усі маршрути віддають index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
